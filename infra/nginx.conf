resolver 127.0.0.11 valid=10s ipv6=off;
upstream ticketrush_api {
  zone ticketrush_api 64k;
  least_conn;
  server api:3000 resolve;
  server api-replica:3000 resolve;
  keepalive 32;
}
upstream ticketrush_web {
  zone ticketrush_web 64k;
  server web:3001 resolve;
}
server {
  listen 80;
  client_max_body_size 20m;
  location /api/ {
    proxy_pass http://ticketrush_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 150s;
  }
  location / {
    proxy_pass http://ticketrush_web;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
  }
}
