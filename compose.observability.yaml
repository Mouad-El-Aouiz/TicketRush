services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  api-replica:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  notifications:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus_data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run setup:local first}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: ["./infra/grafana:/etc/grafana/provisioning:ro", "grafana_data:/var/lib/grafana"]
    ports: ["127.0.0.1:3002:3000"]
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4318:4318"]
volumes:
  prometheus_data:
  grafana_data:
